<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-te-ouvi - Explorar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col font-sans">

  <!-- Componente Reutilizável 1: Header / TopNavBar -->
  <header class="bg-emerald-900 text-white shadow-md">
    <nav class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center" aria-label="Navegação Principal">
      <h1 class="text-2xl font-bold tracking-wide flex items-center gap-2">
        <span>🐦</span> Bem-te-ouvi
      </h1>
      <ul class="flex space-x-6 font-medium mt-2 sm:mt-0">
        <li><a href="index.html" class="text-emerald-200 border-b-2 border-emerald-400 pb-1" aria-current="page">Explorar</a></li>
        <li><a href="cadastro.html" class="hover:text-emerald-200 transition-colors">Novo Registo</a></li>
        <li><a href="detalhes.html" class="hover:text-emerald-200 transition-colors">Detalhes</a></li>
      </ul>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <section class="mb-8 bg-white p-6 rounded-xl shadow-sm border border-stone-200">
      <h2 class="text-xl font-bold mb-4 text-emerald-950">Explorar Vocalizações e Espécies</h2>
      
      <!-- Interação 1: Campo de Busca e Filtro em Tempo Real -->
      <div class="flex flex-col sm:flex-row gap-4">
        <div class="flex-1">
          <label for="search-input" class="block text-sm font-semibold mb-1">Pesquisar por nome ou bioma:</label>
          <input type="text" id="search-input" placeholder="Ex: Bem-te-vi, Amazônia..." 
                 class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
        </div>
      </div>
    </section>

    <!-- Contentor para o Componente Reutilizável 2 (Cards de Aves) -->
    <section aria-labelledby="lista-aves-titulo">
      <h2 id="lista-aves-titulo" class="sr-only">Lista de Registos de Aves</h2>
      <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Inserido dinamicamente pelo app.js -->
      </div>
    </section>
  </main>

  <footer class="bg-stone-800 text-stone-300 py-4 text-center text-sm mt-auto">
    <p>&copy; 2026 Bem-te-ouvi — Bioacústica e Ornitologia</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
